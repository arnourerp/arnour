# keep the database scripts out of the public site
[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true

# test files are for the build check only, not part of the site
[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404
  force = true

# basic security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# the Job feed: every 5 minutes, check a careers page that is due and read waiting roles into drafts (does nothing until FEED_WORKER_SECRET is set)
[functions."job-feed-cron"]
  schedule = "*/5 * * * *"
